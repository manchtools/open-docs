<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Title, description, canonical, and Open Graph / Twitter tags are
		     emitted per-page by the <Seo> component (src/lib/components/seo.svelte)
		     so every route carries its own metadata. Only page-independent
		     tags live here. -->

		<!-- Favicons. Drop your own files into static/ to override.
		     SVG is preferred by modern browsers; PNG fallbacks cover
		     Safari + legacy. apple-touch-icon is iOS home-screen. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

		<!-- Mobile browser chrome tint. Only a pre-hydration fallback (the
		     default light --primary); theme-color.svelte then syncs it to
		     the live --primary token and keeps it in step with dark mode. -->
		<meta name="theme-color" content="#171717" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
